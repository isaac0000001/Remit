name: Remit Production Quality Checks

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  backend-quality:
    name: Backend Tests and Security Checks

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff bandit

      - name: Check Python formatting and quality
        run: |
          ruff check app

      - name: Run security analysis
        run: |
          bandit -r app -ll

      - name: Check application imports
        run: |
          python -c "import app.main; print('Remit backend imports successfully')"

      - name: Run automated tests
        run: |
          if [ -d tests ]; then
            pytest tests -v
          else
            echo "No tests directory exists yet. Test execution skipped."
          fi
